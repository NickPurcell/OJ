# OJO configuration. Every key is read by src/config.ts.

pollIntervalSeconds: 60
maxConcurrentReviews: 2
label: "oj:review"
reviewNewPrs: true
# false: every review posts as a COMMENT. true: clean → APPROVE, blocking → REQUEST_CHANGES.
approve: true

paths:
  workersRoot: /var/lib/oj/workers
  kickoffPrompt: prompts/kickoff.md
  systemPrompt: prompts/worker-system-prompt.md
  stateFile: /var/lib/oj/state.json

worker:
  claudePath: /home/npurcell/.local/bin/claude
  model: ""
  timeoutMinutes: 45
  fetchDepth: 100
  # Deleted from the checkout before the reviewer sees it: files that would otherwise read as
  # instructions. The watched repo's OJ.md reaches the reviewer from the base branch instead.
  stripPaths:
    - CLAUDE.md
    - "**/CLAUDE.md"
    - .claude
    - "**/.claude"
    - OJ.md
    - "**/OJ.md"
    - AGENTS.md
    - "**/AGENTS.md"
    - .cursorrules
    - .cursor
    - .windsurfrules
    - .github/copilot-instructions.md

repos:
  - NickPurcell/OJ
  - NickPurcell/Clawcius
